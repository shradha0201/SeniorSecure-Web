<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <title>SeniorSecure - Legal Form Helper for Seniors</title>
<meta name="description" content="SeniorSecure helps elderly people fill out legal forms easily with step-by-step guidance and voice assistance.">

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans transition duration-300">

  <div class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-4">
      <h1 id="app-title" class="text-3xl font-bold">SeniorSecure</h1>
     
    </div>

    <div id="question-box" class="bg-white dark:bg-gray-800 p-6 rounded shadow">
     
      <input type="text" id="answer" class="w-full p-2 border rounded mb-4" placeholder="Your answer here..." />
      <div class="flex gap-2 flex-wrap">
        <button id="prevBtn" class="bg-gray-600 text-white px-4 py-2 rounded">Previous</button>
        <button id="nextBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Next</button>
        <button id="submitBtn" class="bg-green-600 text-white px-4 py-2 rounded">Submit</button>
        <button id="downloadBtn" class="bg-purple-600 text-white px-4 py-2 rounded hidden">Download</button>
        <button id="resetBtn" class="bg-red-600 text-white px-4 py-2 rounded">Reset</button>
        <button onclick="speakCurrentQuestion()" class="bg-yellow-500 text-white px-4 py-2 rounded">🔊 Listen</button>
      </div>
      <p id="complete-message" class="mt-4 text-green-600 font-semibold"></p>
      <p id="question" class="question-text"></p>

    </div>
  </div>

  <!-- Live Chat Icon (Non-functional placeholder) -->
  <div class="fixed bottom-4 right-4">
    <button class="bg-blue-500 text-white p-3 rounded-full shadow-xl text-xl">💬</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
